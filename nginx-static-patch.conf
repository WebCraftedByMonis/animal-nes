# ─── Static bypass blocks — add these INSIDE your server {} block ─────────────
# Place them BEFORE the existing  location / { proxy_pass ... }  block.
# This makes Nginx serve robots.txt and product images directly from disk,
# completely bypassing Node.js.

# 1. robots.txt — served directly from the Next.js public folder
#    Never times out under load because Node.js is not involved.
location = /robots.txt {
    root /var/www/animalwellness/animal-nes/public;
    add_header Cache-Control "public, max-age=3600";
    access_log off;
}

# 2. Product images — served directly from the uploads/media directory
#    ~100ms instead of ~1400ms. Zero CPU on Node.js per image request.
location /api/admin/media/serve/ {
    alias /var/www/animalwellness/animal-nes/uploads/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    expires 1y;
    access_log off;
}

# ─── How to apply ─────────────────────────────────────────────────────────────
# 1. SSH into the VPS
# 2. Open your Nginx site config:
#      sudo nano /etc/nginx/sites-available/animalwellness.shop
#    (or wherever your config lives — check with: sudo nginx -T | grep "server_name animalwellness")
# 3. Paste both location blocks BEFORE the  location / { proxy_pass ... }  line
# 4. Test:   sudo nginx -t
# 5. Reload: sudo systemctl reload nginx
# 6. Verify robots.txt is fast:
#      curl -w "\nTime: %{time_total}s\n" https://animalwellness.shop/robots.txt
#    Should be under 50ms. If still 1s+, the blocks are in the wrong place.
